[project]
name = "datalab"
version = "0.1.0"
description = "Laboratorio interactivo de análisis de datos con demostraciones reproducibles."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "streamlit>=1.45,<2",
    "pandas>=2.2,<3",
    "numpy>=2,<3",
    "duckdb>=1.2,<2",
    "scipy>=1.15,<2",
    "statsmodels>=0.14.4,<0.15",
    "scikit-learn>=1.6,<2",
    "plotly>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datalab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
